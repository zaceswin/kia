version: '3.8'

services:
  simulator:
    build: .
    command: python src/failed_pentest_simulation.py
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped

  dashboard:
    build: .
    command: uvicorn src.dashboard:app --host 0.0.0.0 --port 8000
    # Port 8000 is intentionally NOT exposed to the host here. 
    # Nginx will securely route traffic to this container.
    volumes:
      - ./logs:/app/logs
    environment:
      - ABUSEIPDB_API_KEY=${ABUSEIPDB_API_KEY}
    restart: unless-stopped

  proxy:
    image: nginx:latest
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "80:80"
    depends_on:
      - dashboard
    restart: unless-stopped

  discord_alert:
    build: .
    command: python src/discord_alert.py
    volumes:
      - ./logs:/app/logs
    environment:
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
    depends_on:
      - simulator
    restart: unless-stopped
