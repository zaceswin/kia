version: '3.8'

services:
  simulator:
    build: .
    command: python src/failed_pentest_simulation.py
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped

  dashboard:
    build: .
    command: uvicorn src.dashboard:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
    environment:
      - ABUSEIPDB_API_KEY=${ABUSEIPDB_API_KEY} # Passed in via .env file
    restart: unless-stopped
