name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-and-build:
    runs-on: ubuntu-24.04  # Pinned to 24.04 LTS to fix Ubuntu 26 and Node.js deprecation warnings
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Linters & Security Scanners
        run: |
          python -m pip install --upgrade pip
          pip install ruff bandit

      - name: Lint Python Code (Ruff)
        run: ruff check .

      - name: Security Scan Python Code (Bandit)
        run: bandit -r . -ll -ii -x tests/

      - name: Compile C Code
        run: |
          # Compiling from the src/ directory based on your new structure
          gcc src/failed_pentest_simulation.c -o pentest_sim
          # Verify the binary was created
          test -x pentest_sim
