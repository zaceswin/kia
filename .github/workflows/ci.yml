name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-and-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff bandit pytest

      - name: Lint Python Code (Ruff)
        run: ruff check .

      - name: Security Scan Python Code (Bandit)
        run: bandit -r . -ll -ii -x tests/

      - name: Run Tests
        env:
          ADMIN_API_KEY: ci-test-key
        run: python -m pytest -q

      - name: Compile C Code
        run: |
          gcc src/failed_pentest_simulation.c -o pentest_sim
          # Verify the binary was created
          test -x pentest_sim
