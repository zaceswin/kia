<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOC Simulation Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; }
    </style>
</head>
<body class="p-8 font-mono">
    <div class="max-w-6xl mx-auto">
        <h1 class="text-3xl font-bold text-red-500 mb-6 flex items-center">
            <span class="mr-2">🚨</span> Failed Access Attempt Monitor
        </h1>
        
        <div class="grid grid-cols-2 gap-4 mb-8">
            <div class="bg-slate-800 p-6 rounded-lg border border-slate-700 shadow-lg">
                <h2 class="text-slate-400 text-sm uppercase">Total Failed Attempts</h2>
                <p class="text-4xl font-bold text-white mt-2">{{ total_attempts }}</p>
            </div>
            <div class="bg-slate-800 p-6 rounded-lg border border-slate-700 shadow-lg">
                <h2 class="text-slate-400 text-sm uppercase">Unique Attacker IPs</h2>
                <p class="text-4xl font-bold text-yellow-400 mt-2">{{ unique_ips }}</p>
            </div>
        </div>

        <div class="bg-slate-800 rounded-lg border border-slate-700 overflow-hidden shadow-lg">
            <table class="w-full text-left text-sm">
                <thead class="bg-slate-900 text-slate-300">
                    <tr>
                        <th class="p-4">Timestamp (UTC)</th>
                        <th class="p-4">Source IP</th>
                        <th class="p-4">Target User</th>
                        <th class="p-4">Status</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-slate-700">
                    {% for log in logs %}
                    <tr class="hover:bg-slate-750 transition-colors">
                        <td class="p-4 text-slate-400">{{ log.timestamp }}</td>
                        <td class="p-4 font-bold text-red-400">{{ log.source_ip }}</td>
                        <td class="p-4">{{ log.username }}</td>
                        <td class="p-4"><span class="px-2 py-1 bg-red-900/50 text-red-500 rounded border border-red-800/50">{{ log.status }}</span></td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
